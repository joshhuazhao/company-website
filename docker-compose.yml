services:
  web:
    image: joshzhao81/website:26.02 # Replace with your image name if pulling from registry
    build: .
    ports:
      - "80:80"
      - "443:443"
    restart: always
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - ./public/locales:/usr/share/nginx/html/locales:ro
      - ./data/certbot/conf:/etc/letsencrypt
      - ./data/certbot/www:/var/www/certbot
    command: "/bin/sh -c 'while :; do sleep 6h & wait $${!}; nginx -s reload; done & nginx -g \"daemon off;\"'"
    depends_on:
      - api

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: always
    environment:
      API_PORT: 3001
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: leanjust
      DB_USER: leanjust
      DB_PASSWORD: ${DB_PASSWORD:-change-me}
      FIREBASE_PROJECT_ID: leanjust-website
      FIREBASE_SERVICE_ACCOUNT_JSON: ${FIREBASE_SERVICE_ACCOUNT_JSON}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres
    restart: always
    environment:
      POSTGRES_DB: leanjust
      POSTGRES_USER: leanjust
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change-me}
    volumes:
      - postgres_data:/var/lib/postgresql/
      - ./server/schema.sql:/docker-entrypoint-initdb.d/001-market-client.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leanjust -d leanjust"]
      interval: 10s
      timeout: 5s
      retries: 5

  certbot:
    image: certbot/certbot
    restart: unless-stopped
    volumes:
      - ./data/certbot/conf:/etc/letsencrypt
      - ./data/certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

volumes:
  postgres_data:
